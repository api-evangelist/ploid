apis:
- name: Ploid MCP Server
  description: >-
    Ploid's hosted Streamable HTTP MCP server at https://api.ploid.com/mcp, protected by OAuth 2.1 (RFC
    9728 protected-resource metadata, dynamic client registration, PKCE S256) and scoped to an approved
    workspace. Documented tools: research_person, find_people, find_decision_makers, get_research_status
    and cancel_research, backed by POST /v1/person and the People Sets preview.
  humanURL: https://ploid.com/documentation/mcp
  baseURL: https://api.ploid.com/mcp
  tags:
  - MCP
