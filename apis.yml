aid: ploid
name: Ploid
description: 'Ploid is an applied AI lab building a people search and intelligence platform: a living index of more
  than two billion people available through a web app, a REST API, a CLI, and a hosted MCP server. The Ploid Public
  API (OpenAPI 3.1, 31 operations on api.ploid.com) covers synchronous people search, person resolution and evidence-backed
  person research runs, contact and social enrichment, public LinkedIn reads, monitors, and account usage and credit
  budgets, metered in ACU credits.'
