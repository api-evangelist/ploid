tools_count: 5
tools_source: 'Provider-published "Available tools" table on https://ploid.com/documentation/mcp (l3: table). These
  are the names the provider documents; the live tools/list is OAuth-gated (401) and was not called.'
tools:
- name: research_person
  description: Source-reviewed deep research on one person. Calls POST /v1/person (one deep mode; first successful
    profile costs a fixed 25 ACU, free rereads for 90 days).
  api: POST /v1/person
  inputs:
    linkedin_url: The person's LinkedIn profile URL
    name: The person's full name; requires company_domain
    company_domain: Web domain of the person's company, for example acme.com
- name: find_people
  description: Build a verified list of people from a natural-language query (count up to 25). Creates a People
    Set through POST /v1/sets.
  api: POST /v1/sets
- name: find_decision_makers
  description: Build a verified list of likely buyers at a company (company, product being sold, optional titles,
    count up to 20). Creates a People Set through POST /v1/sets.
  api: POST /v1/sets
- name: get_research_status
  description: Retrieve a run's status or completed result using its run_id (person-<id> or set-<id>); read-only,
    poll no more often than every five seconds.
  api: Person run or Set status
- name: cancel_research
  description: Explicitly stop a run; cancellation does not refund work already done.
  api: Person run cancellation or Set cancel
removed_tools:
