  probe: 'preflight-wave.py (2026-10-07) POST to https://api.ploid.com/mcp returned 401 while a control path returned
    404: the endpoint exists and is OAuth-gated. The docs page names the same URL as the hosted endpoint, and https://ploid.com/.well-known/oauth-protected-resource
    declares resource https://api.ploid.com/mcp with authorization_servers [https://api.ploid.com].'
  oauth:
    protected_resource_metadata: https://api.ploid.com/.well-known/oauth-protected-resource
    authorization_server_metadata: https://api.ploid.com/.well-known/oauth-authorization-server
    authorization_endpoint: https://ploid.com/auth/mcp
    token_endpoint: https://api.ploid.com/oauth/token
