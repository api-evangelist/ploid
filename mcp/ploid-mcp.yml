name: Ploid MCP Server
description: Ploid's hosted Streamable HTTP MCP server for people research inside ChatGPT, Claude and other remote
  MCP clients. Connections are scoped to an approved Ploid workspace and consume that workspace's ACU balance; the
  three research tools can consume paid usage.
server:
  name: Ploid
  transport: streamable-http
  url: https://api.ploid.com/mcp
deployment:
  mode: remote
  endpoint: https://api.ploid.com/mcp
  auth: oauth
