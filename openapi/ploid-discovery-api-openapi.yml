openapi: 3.2.0
info:
  title: Ploid Public Discovery API
  version: 2.0.0
  description: Ploid's focused agent-native people API. Start with 50 ACU for 30 days after creating an account.
servers:
- url: https://api.ploid.com
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: Discovery
paths:
  /v1/openapi.json:
    get:
      operationId: getOpenApiDocument
      summary: Download the public OpenAPI document
      description: Returns this OpenAPI 3.1 contract. No authentication is required.
      tags:
      - Discovery
      security: []
      responses:
        '200':
          description: Public OpenAPI 3.1 document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
