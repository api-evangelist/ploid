openapi: 3.2.0
info:
  title: Ploid LinkedIn API
  version: 2.0.0
  description: 'Operations tagged LinkedIn across 2 of this provider''s published API definitions: ploid-openapi.json, ploid-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.ploid.com
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: Linked In
paths:
  /v1/linkedin/profile:
    get:
      operationId: getLinkedInProfile
      summary: Fetch a LinkedIn profile
      description: Returns a LinkedIn profile by URL, vanity slug, or @handle. Requires the linkedin:read scope.
      tags:
      - Linked In
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      parameters:
      - name: url
        in: query
        required: false
        schema:
          type: string
        description: LinkedIn profile URL, slug, or @handle.
      - name: identifier
        in: query
        required: false
        schema:
          type: string
        description: Alias for `url`.
      responses:
        '200':
          description: LinkedIn profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedInProfileResponse'
        '401':
          description: Missing, invalid, expired, or revoked API credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        '402':
          description: The workspace does not currently have active public-API access, or the requested operation exceeds available ACU or an API-key budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        '403':
          description: Missing linkedin:read scope or public-API access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        '404':
          description: Profile not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        '422':
          description: The request body, path parameters, or query parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        '429':
          description: The organization or API-key per-minute rate limit was exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                minimum: 1
        '503':
          description: LinkedIn data source unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
    servers:
    - url: https://api.ploid.com
  /v1/linkedin/search:
    post:
      operationId: searchLinkedInPeople
      summary: Search LinkedIn people
      description: Structured LinkedIn people search by keywords, location, title, company, and school. Requires the linkedin:read scope.
      tags:
      - Linked In
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkedInSearchRequest'
      responses:
        '200':
          description: LinkedIn search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedInSearchResponse'
        '401':
          description: Missing, invalid, expired, or revoked API credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        '402':
          description: Public-API access is inactive, or the workspace has insufficient ACU or API-key budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        '403':
          description: Missing linkedin:read scope or public-API access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        '422':
          description: The request body, path parameters, or query parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
        '429':
          description: The organization or API-key per-minute rate limit was exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                minimum: 1
        '503':
          description: LinkedIn data source unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiError'
    servers:
    - url: https://api.ploid.com
  /v1/linkedin/posts:
    get:
      operationId: listLinkedInPosts
      summary: List recent LinkedIn posts
      description: Returns recent posts for a LinkedIn profile. Requires the linkedin:read scope.
      tags:
      - Linked In
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      parameters:
      - name: identifier
        in: query
        required: false
        schema:
          type: string
        description: LinkedIn profile URL, slug, or @handle.
      - name: url
        in: query
        required: false
        schema:
          type: string
        description: Alias for `identifier`.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
      responses:
        '200':
          description: Recent posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedInPostsResponse'
        '401':
          description: Missing, invalid, expired, or revoked API credential.
          content:
