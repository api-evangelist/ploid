                        company:
                          type:
                          - string
                          - 'null'
                        location:
                          type:
                          - string
                          - 'null'
                      required:
                      - headline
                      - company
                      - location
                      additionalProperties: false
                    history:
                      type: array
                      items:
                        type: object
                        properties:
                          title:
                            type:
                            - string
                            - 'null'
                          company:
                            type:
                            - string
                            - 'null'
                          period:
                            type:
                            - string
                            - 'null'
                          location:
                            type:
                            - string
                            - 'null'
                          confidence:
                            type: number
                            minimum: 0
                            maximum: 1
                          timeframe:
                            type: string
                            enum:
                            - historical
                            - undated
                            - dated
                          evidence_statement:
                            type: string
                        required:
                        - title
                        - company
                        - period
                        - location
                        - confidence
                        additionalProperties: false
                    education:
                      type: array
                      items:
                        type: object
                        properties:
                          school:
                            type:
                            - string
                            - 'null'
                          degree:
                            type:
                            - string
                            - 'null'
                          field_of_study:
                            type:
                            - string
                            - 'null'
                          period:
                            type:
                            - string
                            - 'null'
                          confidence:
                            type: number
                            minimum: 0
                            maximum: 1
                          timeframe:
                            type: string
                            enum:
                            - historical
                            - undated
                            - dated
                          evidence_statement:
                            type: string
                        required:
                        - school
                        - degree
                        - field_of_study
                        - period
                        - confidence
                        additionalProperties: false
                    skills:
                      anyOf:
                      - type: array
                        items:
                          type: string
