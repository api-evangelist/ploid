                presence:
                  type: object
                  properties:
                    platforms:
                      type: array
                      items:
                        type: object
                        properties:
                          timeframe:
                            type: string
                            enum:
                            - historical
                            - undated
                            - dated
                          evidence_statement:
                            type: string
                          source_urls:
                            type: array
                            items:
                              type: string
                              format: uri
                          platform:
                            type: string
                          handle:
                            type:
                            - string
                            - 'null'
                          url:
                            type: string
                            format: uri
                          display_name:
                            type:
                            - string
                            - 'null'
                          bio:
                            type:
                            - string
                            - 'null'
                          avatar_url:
                            anyOf:
                            - type: string
                              format: uri
                            - type: 'null'
                          followers:
                            anyOf:
                            - type: integer
                              minimum: 0
                            - type: 'null'
                          following:
                            anyOf:
                            - type: integer
                              minimum: 0
                            - type: 'null'
                          content_count:
                            anyOf:
                            - type: integer
                              minimum: 0
                            - type: 'null'
                          total_likes:
                            anyOf:
                            - type: integer
                              minimum: 0
                            - type: 'null'
                          verified:
                            type:
                            - boolean
                            - 'null'
                          private:
                            type:
                            - boolean
                            - 'null'
                          last_active:
                            anyOf:
                            - type: string
                              format: date-time
                            - type: 'null'
                          topics:
                            type: array
                            items:
                              type: string
                          recent_activity:
                            type: array
                            items:
                              type: object
                              properties:
                                kind:
                                  type: string
                                  enum:
                                  - post
                                  - share
                                  - article
                                  - video
                                  - repository
                                  - unknown
                                url:
                                  type: string
                                  format: uri
                                text:
                                  type:
                                  - string
                                  - 'null'
                                published_at:
                                  anyOf:
                                  - type: string
                                    format: date-time
                                  - type: 'null'
                                media_urls:
                                  type: array
                                  items:
                                    type: string
                                    format: uri
                                likes:
                                  anyOf:
                                  - type: integer
                                    minimum: 0
